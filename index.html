<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
  :root{
    --ink:#12313F;
    --ink-2:#1B4655;
    --paper:#F5F7F7;
    --card:#FFFFFF;
    --line:#DCE3E3;
    --text:#1C2B2E;
    --muted:#5B6E71;
    --ok:#2E7D5B;
    --warn:#C97C1E;
    --bad:#C4433B;
    --accent:#0E7C86;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Helvetica Neue",Arial,sans-serif;
    background:var(--paper);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .app-container{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);padding-bottom:80px;}
  @media (min-width:900px){.app-container{max-width:900px;}}

  .topbar{background:var(--ink);color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:10;}
  .topbar h1{margin:0;font-size:19px;letter-spacing:0.02em;font-weight:700;}
  .topbar .sub{font-size:12px;color:#9FC3C9;margin-top:2px;}

  .tabs{display:flex;background:var(--ink-2);position:sticky;top:56px;z-index:9;overflow-x:auto;}
  .tab{flex:1;text-align:center;padding:11px 6px;font-size:13px;color:#B9D3D6;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;}
  .tab.active{color:#fff;border-bottom:3px solid var(--accent);font-weight:600;}

  .content{padding:14px 14px 40px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;}
  .card h2{font-size:15px;margin:0 0 10px;color:var(--ink);}

  .row{display:flex;gap:8px;margin-bottom:8px;}
  .row > *{flex:1;}
  input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-size:14px;background:#fff;color:var(--text);}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;}

  button{border:none;border-radius:7px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:disabled{background:#9FC3C9;cursor:not-allowed;}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn-danger{background:#fff;border:1px solid var(--bad);color:var(--bad);}
  .btn-sm{padding:6px 10px;font-size:12.5px;}
  .btn-export{background:var(--ink);color:#fff;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.03em;padding:6px 4px;border-bottom:1px solid var(--line);}
  td{padding:8px 4px;border-bottom:1px solid #EDF1F1;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}

  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;}
  .pill-ok{background:#E4F2EB;color:var(--ok);}
  .pill-warn{background:#FBEEDD;color:var(--warn);}
  .pill-bad{background:#FBE8E7;color:var(--bad);}
  .pill-muted{background:#EEF1F1;color:var(--muted);}

  .empty{text-align:center;color:var(--muted);font-size:13.5px;padding:30px 10px;}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:20px;}
  .login-card{background:#fff;border-radius:14px;padding:28px 22px;width:100%;max-width:340px;}
  .login-card h1{font-size:18px;color:var(--ink);margin:0 0 4px;}
  .login-card p{font-size:13px;color:var(--muted);margin:0 0 18px;}
  .login-card .err{color:var(--bad);font-size:12.5px;margin-top:8px;}

  .link{color:var(--accent);text-decoration:none;font-size:13px;font-weight:600;}
  .muted{color:var(--muted);font-size:12.5px;}
  .diff-pos{color:var(--bad);font-weight:700;}
  .diff-neg{color:var(--ok);font-weight:700;}
  .diff-zero{color:var(--muted);}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap;}
  .toolbar h2{margin:0;}
  .search{margin-bottom:10px;}
  .src-tag{font-size:10.5px;color:var(--accent);background:#E6F3F4;border-radius:5px;padding:1px 6px;margin-left:6px;}

const APP_PASSWORD = "sampo1313";

function fmtMoney(n){
  if(n===null || n===undefined || n==="") return "-";
  return Number(n).toLocaleString("zh-TW");
}
function toNum(v){
  if(v===null || v===undefined || v==="") return null;
  const n = Number(String(v).replace(/[^0-9.\-]/g,""));
  return isNaN(n) ? null : n;
}

// 從 Sampo 價格表 item 決定「官方刊登價」：優先網路查價，其次建議售價，其次售價
function officialPriceOf(item){
  const wc = toNum(item.webCheck);
  if(wc!==null) return {price: wc, field: "網路查價"};
  const sg = toNum(item.suggest);
  if(sg!==null) return {price: sg, field: "建議售價（無網路查價，改用此欄）"};
  const pr = toNum(item.price);
  if(pr!==null) return {price: pr, field: "售價（無網路查價/建議售價，改用此欄）"};
  return {price: null, field: ""};
}

// ---------- 登入 ----------

        </div>
      </div>

}

// ---------- 共用：讀取 Sampo 價格表並攤平 ----------
function useSampoOfficialPrices(){
  const [items, setItems] = useState([]); // [{model, cat, sheetName, official, officialField, base, promo, suggest, price, webCheck}]
  const [loading, setLoading] = useState(true);
  const [updatedAt, setUpdatedAt] = useState(null);

  useEffect(()=>{
    const unsub = sampoDb.collection("priceList").doc("current").onSnapshot(doc=>{
      if(doc.exists){
        const d = doc.data();
        setUpdatedAt(d.updatedAt || null);
        const flat = [];
        (d.sheets||[]).forEach(sheet=>{
          (sheet.items||[]).forEach(it=>{
            const off = officialPriceOf(it);
            flat.push({
              model: it.model,
              cat: it.cat || sheet.name,
              sheetName: sheet.name,
              official: off.price,
              officialField: off.field,
              base: it.base, promo: it.promo, suggest: it.suggest, price: it.price, webCheck: it.webCheck
            });
          });
        });
        setItems(flat);
      }
      setLoading(false);
    }, ()=>setLoading(false));
    return unsub;
  },[]);

  return { items, loading, updatedAt };
}

// ---------- 官方刊登價 Tab（唯讀，同步自 Sampo）----------
function OfficialPricesTab(){

        <p className="muted" style={{marginTop:-4}}>
          共 {items.length} 個機型{updatedAt ? "，價格表最後更新：" + updatedAt : ""}

        </p>
        <p className="muted" style={{marginTop:4}}>
          比對基準優先用「網路查價」欄，若該機型沒有網路查價則自動改用建議售價或售價（會標註使用哪一欄）。
        </p>
        <p className="muted" style={{marginTop:4}}>
          資料是唯讀的，要更新請到 Sampo 系統的「管理」頁重新上傳 💲 價格表 / ❄️ 冷氣價格表。
        </p>
      </div>
      <div className="card">
        <input className="search" placeholder="搜尋機型..." value={q} onChange={e=>setQ(e.target.value)} />
        {loading ? <div className="empty">載入中...</div> :
         filtered.length===0 ? <div className="empty">尚無資料，請先到 Sampo 系統上傳價格表</div> :
        <table>
          <thead><tr><th>機型</th><th>分類</th><th>官方刊登價</th></tr></thead>
          <tbody>
            {filtered.map(i=>(
              <tr key={i.model}>
                <td>{i.model}</td>
                <td>{i.cat}</td>
                <td>
                  {i.official===null ? <span className="pill pill-muted">無資料</span> :
                    <>{fmtMoney(i.official)}<div className="muted">{i.officialField}</div></>}

// ---------- 經銷商 Tab ----------
function DealersTab(){
  const [dealers, setDealers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState({name:"", area:"", url:"", platform:"自架網站"});

  useEffect(()=>{
    const unsub = db.collection("dealers").orderBy("name").onSnapshot(snap=>{
      setDealers(snap.docs.map(d=>({id:d.id, ...d.data()})));
      setLoading(false);
    });
    return unsub;
  },[]);

  const addDealer = async () => {
    if(!form.name.trim() || !form.url.trim()) return;
    await db.collection("dealers").add({...form, name: form.name.trim(), url: form.url.trim(), createdAt: new Date().toISOString()});
    setForm({name:"", area:"", url:"", platform:"自架網站"});
  };

  const removeDealer = async (id) => {
    if(!confirm("確定刪除這個經銷商？（相關查價紀錄不會自動刪除）")) return;
    await db.collection("dealers").doc(id).delete();
  };

  return (
    <div>
      <div className="card">
        <h2>新增經銷商</h2>
        <div className="row">
          <input placeholder="經銷商名稱" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} />
          <input placeholder="區域 (如 A42B)" value={form.area} onChange={e=>setForm({...form,area:e.target.value})} />
        </div>
        <div className="row"><input placeholder="網址 (https://...)" value={form.url} onChange={e=>setForm({...form,url:e.target.value})} /></div>
        <div className="row">
          <select value={form.platform} onChange={e=>setForm({...form,platform:e.target.value})}>
            <option>自架網站</option><option>蝦皮</option><option>PChome</option><option>momo</option><option>其他平台</option>
          </select>
        </div>
        <button className="btn-primary" onClick={addDealer}>新增經銷商</button>
      </div>

      <div className="card">
        <h2>經銷商清單（{dealers.length}）</h2>
        {loading ? <div className="empty">載入中...</div> :
         dealers.length===0 ? <div className="empty">尚無經銷商，請先新增</div> :
        <table>
          <thead><tr><th>名稱</th><th>區域</th><th>平台</th><th></th></tr></thead>
          <tbody>
            {dealers.map(d=>(
              <tr key={d.id}>
                <td><div>{d.name}</div><a className="link" href={d.url} target="_blank" rel="noopener">開啟網址 ↗</a></td>
                <td>{d.area||"-"}</td>
                <td><span className="pill pill-muted">{d.platform}</span></td>
                <td style={{textAlign:"right"}}><button className="btn-danger btn-sm" onClick={()=>removeDealer(d.id)}>刪除</button></td>
              </tr>
            ))}
          </tbody>
        </table>}
      </div>
    </div>
  );
}

// ---------- 查價比對 Tab ----------
function CheckTab(){
  const [dealers, setDealers] = useState([]);
  const { items: officials } = useSampoOfficialPrices();
  const [selectedDealer, setSelectedDealer] = useState("");
  const [selectedModel, setSelectedModel] = useState("");
  const [observedPrice, setObservedPrice] = useState("");
  const [note, setNote] = useState("");
  const [recentChecks, setRecentChecks] = useState([]);

  useEffect(()=>{
    const u1 = db.collection("dealers").orderBy("name").onSnapshot(snap=>{
      setDealers(snap.docs.map(d=>({id:d.id,...d.data()})));
    });
    return u1;
  },[]);

  useEffect(()=>{
    if(!selectedDealer) { setRecentChecks([]); return; }
    const unsub = db.collection("priceChecks")
      .where("dealerId","==",selectedDealer)
      .orderBy("checkedAt","desc")
      .limit(20)
      .onSnapshot(snap=>{
        setRecentChecks(snap.docs.map(d=>({id:d.id,...d.data()})));
      });
    return unsub;
  },[selectedDealer]);

  const dealer = dealers.find(d=>d.id===selectedDealer);
  const official = officials.find(o=>o.model===selectedModel);

  const exportDealerReport = async () => {
    if(!selectedDealer || !dealer) return;
    const snap = await db.collection("priceChecks").where("dealerId","==",selectedDealer).orderBy("checkedAt","desc").get();
    const latestByModel = new Map();
    snap.docs.forEach(d=>{
      const c = d.data();
      if(!latestByModel.has(c.model)) latestByModel.set(c.model, c);
    });
    const rows = Array.from(latestByModel.values()).sort((a,b)=>(a.model||"").localeCompare(b.model||""));
    if(rows.length===0){ alert("這個經銷商還沒有任何查價紀錄"); return; }
    const header = ["機型", "網路查價", dealer.name + "露出價", "差異"];
    const aoa = [header, ...rows.map(c=>[c.model, c.officialPrice, c.observedPrice, c.diff])];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = [{wch:16},{wch:12},{wch:14},{wch:10}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "露出價差異");
    XLSX.writeFile(wb, `${dealer.name}露出價差異.xlsx`);
  };

  const submitCheck = async () => {
    if(!selectedDealer || !selectedModel || observedPrice==="") return;
    const officialPrice = official ? official.official : null;
    const diff = officialPrice!==null ? Number(observedPrice) - officialPrice : null;
    await db.collection("priceChecks").add({
      dealerId: selectedDealer,
      dealerName: dealer ? dealer.name : "",
      dealerArea: dealer ? (dealer.area||"") : "",
      model: selectedModel,
      officialPrice,
      officialField: official ? official.officialField : "",
      observedPrice: Number(observedPrice),
      diff,
      note: note.trim(),
      checkedAt: new Date().toISOString(),
      source: "manual"
    });
    setObservedPrice(""); setNote("");
  };

  return (
    <div>
      <div className="card">
        <h2>選擇經銷商</h2>
        <select value={selectedDealer} onChange={e=>setSelectedDealer(e.target.value)}>
          <option value="">請選擇經銷商</option>
          {dealers.map(d=><option key={d.id} value={d.id}>{d.name}（{d.area||"-"}）</option>)}
        </select>
        {dealer && <div style={{marginTop:8}}><a className="link" href={dealer.url} target="_blank" rel="noopener">開啟 {dealer.name} 網站查看售價 ↗</a></div>}
      </div>

      {selectedDealer && (
        <div className="card">
          <h2>輸入查到的售價</h2>
          <div className="row">
            <select value={selectedModel} onChange={e=>setSelectedModel(e.target.value)}>
              <option value="">選擇機型</option>
              {officials.map(o=><option key={o.model} value={o.model}>{o.model}</option>)}
            </select>
          </div>
          {selectedModel && (
            <p className="muted" style={{marginTop:-4}}>
              官方刊登價：{official && official.official!==null ? fmtMoney(official.official)+"（"+official.officialField+"）" : "尚無資料"}
            </p>
          )}
          <div className="row"><input placeholder="網站上看到的售價" type="number" value={observedPrice} onChange={e=>setObservedPrice(e.target.value)} /></div>
          <div className="row"><input placeholder="備註（選填，如活動特價、缺貨等）" value={note} onChange={e=>setNote(e.target.value)} /></div>
          <button className="btn-primary" onClick={submitCheck} disabled={!selectedModel || observedPrice===""}>送出比對</button>
        </div>
      )}

      {selectedDealer && (
        <div className="card">
          <div className="toolbar">
            <h2>{dealer ? dealer.name : ""} 最近查價紀錄</h2>
            <button className="btn-export btn-sm" onClick={exportDealerReport}>📥 下載差異報表</button>
          </div>
          {recentChecks.length===0 ? <div className="empty">尚無紀錄</div> :
          <table>
            <thead><tr><th>機型</th><th>官方價</th><th>查到價</th><th>差異</th></tr></thead>
            <tbody>
              {recentChecks.map(c=>(
                <tr key={c.id}>
                  <td>{c.model}</td>
                  <td>{fmtMoney(c.officialPrice)}</td>
                  <td>{fmtMoney(c.observedPrice)}</td>
                  <td>
                    {c.diff===null ? <span className="diff-zero">-</span> :
                     c.diff===0 ? <span className="diff-zero">一致</span> :
                     c.diff<0 ? <span className="diff-neg">{fmtMoney(c.diff)}</span> :
                     <span className="diff-pos">+{fmtMoney(c.diff)}</span>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>}
        </div>
      )}
    </div>
  );
}

// ---------- 總覽 Tab ----------
function DashboardTab(){
  const [checks, setChecks] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filter, setFilter] = useState("all"); // all | mismatch | ok

  useEffect(()=>{
    const unsub = db.collection("priceChecks").orderBy("checkedAt","desc").limit(500).onSnapshot(snap=>{
      setChecks(snap.docs.map(d=>({id:d.id,...d.data()})));
      setLoading(false);
    });
    return unsub;
  },[]);

  // 每個 經銷商+機型 只取最新一筆
  const latestByKey = useMemo(()=>{
    const map = new Map();
    checks.forEach(c=>{
      const key = c.dealerId + "__" + c.model;
      if(!map.has(key)) map.set(key, c);
    });
    return Array.from(map.values());
  },[checks]);

  const filtered = latestByKey.filter(c=>{
    if(filter==="mismatch") return c.diff!==0 && c.diff!==null;
    if(filter==="ok") return c.diff===0;
    return true;
  });

  const mismatchCount = latestByKey.filter(c=>c.diff!==0 && c.diff!==null).length;

  const exportExcel = () => {
    const rows = latestByKey
      .slice()
      .sort((a,b)=> (a.dealerName||"").localeCompare(b.dealerName||"", "zh-Hant"))
      .map(c=>({
        "經銷商": c.dealerName || "",
        "區域": c.dealerArea || "",
        "機型": c.model || "",
        "官方刊登價": c.officialPrice===null || c.officialPrice===undefined ? "" : c.officialPrice,
        "刊登價來源欄位": c.officialField || "",
        "經銷商網路售價": c.observedPrice===null || c.observedPrice===undefined ? "" : c.observedPrice,
        "差異(售價-官方價)": c.diff===null || c.diff===undefined ? "" : c.diff,
        "狀態": c.diff===null || c.diff===undefined ? "未知" : c.diff===0 ? "一致" : c.diff<0 ? "低於刊登價" : "高於刊登價",
        "查價時間": c.checkedAt || "",
        "備註": c.note || ""
      }));

    const ws = XLSX.utils.json_to_sheet(rows);
    ws["!cols"] = [
      {wch:14},{wch:8},{wch:20},{wch:12},{wch:20},{wch:14},{wch:14},{wch:12},{wch:20},{wch:20}
    ];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "查價差異報告");
    const today = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, `網路查價差異報告_${today}.xlsx`);
  };

  return (
    <div>
      <div className="card">
        <h2>總覽</h2>
        <p className="muted" style={{marginTop:-4}}>
          共 {latestByKey.length} 筆最新查價紀錄，其中 <b style={{color:"var(--bad)"}}>{mismatchCount}</b> 筆與官方刊登價不符
        </p>
        <div className="row">
          <button className={filter==="all"?"btn-primary btn-sm":"btn-ghost btn-sm"} onClick={()=>setFilter("all")}>全部</button>
          <button className={filter==="mismatch"?"btn-primary btn-sm":"btn-ghost btn-sm"} onClick={()=>setFilter("mismatch")}>僅顯示不符</button>
          <button className={filter==="ok"?"btn-primary btn-sm":"btn-ghost btn-sm"} onClick={()=>setFilter("ok")}>僅顯示一致</button>
        </div>
        <div style={{marginTop:10}}>
          <button className="btn-export" onClick={exportExcel} disabled={latestByKey.length===0}>📥 下載 Excel 差異報告</button>
        </div>
      </div>

      <div className="card">
        {loading ? <div className="empty">載入中...</div> :
         filtered.length===0 ? <div className="empty">尚無資料</div> :
        <table>
          <thead><tr><th>經銷商</th><th>機型</th><th>官方價</th><th>查到價</th><th>差異</th></tr></thead>
          <tbody>
            {filtered.map(c=>(
              <tr key={c.id}>
                <td>{c.dealerName}</td>
                <td>{c.model}</td>
                <td>{fmtMoney(c.officialPrice)}</td>
                <td>{fmtMoney(c.observedPrice)}</td>
                <td>
                  {c.diff===null ? <span className="pill pill-muted">未知</span> :
                   c.diff===0 ? <span className="pill pill-ok">一致</span> :
                   c.diff<0 ? <span className="pill pill-bad">低賣 {fmtMoney(Math.abs(c.diff))}</span> :
                   <span className="pill pill-warn">高於 {fmtMoney(c.diff)}</span>}
                </td>
              </tr>
            ))}
          </tbody>
        </table>}
      </div>
    </div>
  );
}

// ---------- App ----------
function App(){
  const [authed, setAuthed] = useState(sessionStorage.getItem("pcs_authed")==="1");
  const [tab, setTab] = useState("dashboard");

  const login = () => { sessionStorage.setItem("pcs_authed","1"); setAuthed(true); };

  if(!authed) return <Login onSuccess={login} />;

  return (
    <div className="app-container">
      <div className="topbar">
        <h1>網路查價系統</h1>
        <div className="sub">經銷商刊登價稽核</div>
      </div>
      <div className="tabs">
        <div className={"tab"+(tab==="dashboard"?" active":"")} onClick={()=>setTab("dashboard")}>總覽</div>
        <div className={"tab"+(tab==="check"?" active":"")} onClick={()=>setTab("check")}>查價比對</div>
        <div className={"tab"+(tab==="dealers"?" active":"")} onClick={()=>setTab("dealers")}>經銷商</div>
        <div className={"tab"+(tab==="official"?" active":"")} onClick={()=>setTab("official")}>官方刊登價</div>
      </div>
      <div className="content">
        {tab==="dashboard" && <DashboardTab/>}
        {tab==="check" && <CheckTab/>}
        {tab==="dealers" && <DealersTab/>}
        {tab==="official" && <OfficialPricesTab/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
